[workspace]

[package]
name    = "raffle-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Fuzzing tests for Tikka raffle smart contracts"
repository = "https://github.com/crackedstudio/tikka-contracts"
authors = ["Tikka Team"]
keywords = ["soroban", "stellar", "raffle", "defi", "blockchain"]
categories = ["development-tools::testing"]

# ── cargo-fuzz targets ──────────────────────────────────────────────────────
[[bin]]
name = "fuzz_buy_ticket"
path = "fuzz_targets/fuzz_buy_ticket.rs"
test = false

[[bin]]
name = "fuzz_finalize_raffle"
path = "fuzz_targets/fuzz_finalize_raffle.rs"
test = false

[[bin]]
name = "fuzz_winner_selection"
path = "fuzz_targets/fuzz_winner_selection.rs"
test = false

[[bin]]
name = "fuzz_refund_cancel"
path = "fuzz_targets/fuzz_refund_cancel.rs"
test = false

[[bin]]
name = "fuzz_commit_reveal"
path = "fuzz_targets/fuzz_commit_reveal.rs"
test = false

[[bin]]
name = "fuzz_lifecycle"
path = "fuzz_targets/fuzz_lifecycle.rs"
test = false

[dependencies]
# libfuzzer-sys wires rust code to LLVM libFuzzer
libfuzzer-sys = "0.4"
# Derives arbitrary byte→type conversion for fuzzer inputs
arbitrary     = { version = "1", features = ["derive"] }
# Local contracts
tikka-raffle-instance = { package = "raffle-instance", path = "../contracts/raffle-instance", features = ["std", "testutils"] }
soroban-sdk = { version = "23", features = ["testutils"] }
