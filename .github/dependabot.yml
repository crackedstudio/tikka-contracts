version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      rust-dev-tooling:
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - "soroban-sdk"
          - "ed25519-dalek"
          - "sha2"

  - package-ecosystem: npm
    directory: /oracle
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /oracle
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
