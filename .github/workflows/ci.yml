name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI Pipeline (make ci)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Toolchain version is driven entirely by rust-toolchain.toml in the repo root.
      # No explicit toolchain version here — that would duplicate the pin and drift.
      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js (for oracle lint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: oracle/package-lock.json

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      # The Makefile is the single source of truth for all checks.
      # If this command passes locally (`make ci`) it will pass here.
      - name: Run full CI pipeline
        run: make ci
