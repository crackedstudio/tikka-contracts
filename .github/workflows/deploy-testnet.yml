name: Deploy to Testnet

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match STELLAR_CLI_VERSION in scripts/common.sh (issues #841, #843).
  STELLAR_CLI_VERSION: "23.4.1"

jobs:
  deploy:
    name: Build and Deploy to Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up pinned Rust toolchain
      run: |
        rustup toolchain install "$(awk -F'"' '/^channel/ { print $2; exit }' rust-toolchain.toml)"
        rustup show

    - name: Install Stellar CLI
      timeout-minutes: 5
      run: |
        curl -sSL --retry 3 --retry-delay 5 \
          "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
          | tar -xz
        sudo mv stellar /usr/local/bin/stellar
        stellar --version

    - name: Cache dependencies
      uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8

    # deploy-testnet.sh builds, installs the instance WASM, deploys the factory,
    # initialises it and verifies the deployed bytecode (issues #842, #843).
    - name: Deploy Contract
      timeout-minutes: 12
      env:
        DEPLOYER_SECRET_KEY: ${{ secrets.DEPLOYER_SECRET_KEY }}
        ADMIN_ADDRESS: ${{ secrets.ADMIN_ADDRESS }}
        TREASURY_ADDRESS: ${{ secrets.TREASURY_ADDRESS }}
        PROTOCOL_FEE_BP: ${{ vars.PROTOCOL_FEE_BP || '0' }}
        # A CI deploy always supersedes the recorded address.
        ALLOW_REDEPLOY: '1'
      run: ./scripts/deploy-testnet.sh

    - name: Upload deployment manifest
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: testnet-deployment
        path: deployments/
