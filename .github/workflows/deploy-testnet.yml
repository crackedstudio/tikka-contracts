name: Deploy to Testnet

on:
  push:
    branches: ["master"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build and Deploy to Testnet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Toolchain version is driven entirely by rust-toolchain.toml in the repo root.
      - name: Set up Rust (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build contracts
        run: make build

      - name: Deploy to testnet
        env:
          DEPLOYER_SECRET_KEY: ${{ secrets.DEPLOYER_SECRET_KEY }}
        run: |
          chmod +x ./scripts/deploy-testnet.sh
          ./scripts/deploy-testnet.sh
