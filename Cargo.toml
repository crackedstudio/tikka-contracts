[workspace]
resolver = "2"
members = [
  "contracts/raffle-factory",
  "contracts/raffle-instance",
  "contracts/raffle-shared",
]
default-members = [
  "contracts/raffle-factory",
  "contracts/raffle-instance",
  "contracts/raffle-shared",
]

[workspace.package]
rust-version = "1.70"


[workspace.dependencies]
soroban-sdk = "23"
ed25519-dalek = "=2.1.1"
getrandom = "0.4.3"
rand = "0.8.8"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = "fat"

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
