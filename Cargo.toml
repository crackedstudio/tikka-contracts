[workspace]
resolver = "2"
members = [
  "contracts/*",
]
default-members = ["contracts/*"]

[workspace.package]
# Mirrors rust-toolchain.toml.  cargo honors `rust-version` in workspace
# metadata to reject MSRV-violating dependency resolutions at the resolver
# level.  Must be updated atomically with rust-toolchain.toml +
# docs/DEPLOYMENT.md.
rust-version = "1.83.0"
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "23"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = "fat"

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
