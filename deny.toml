# Supply-chain policy for the Rust workspace.
# See CONTRIBUTING.md for how to request exceptions.

[licenses]
allow = [
  'MIT',
  'Apache-2.0',
  'Apache-2.0 WITH LLVM-exception',
  'ISC',
  'BSD-2-Clause',
  'BSD-3-Clause',
]

[bans]
multiple-versions = 'warn'
deny = []

[advisories]
ignore = []
